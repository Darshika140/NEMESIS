<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">NEMESIS execution trace UI preview</title>
  <desc id="desc">A side-by-side system monitoring panel showing an execution trace on the left and recent detections on the right.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#c9d7d2" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="#e9efed"/>

  <g>
    <rect x="0" y="0" width="800" height="980" fill="#edf2f1"/>
    <rect x="800" y="0" width="800" height="980" fill="#edf2f1"/>

    <rect x="0" y="0" width="800" height="980" fill="#edf2f1"/>
    <rect x="800" y="0" width="800" height="980" fill="#edf2f1"/>

    <rect x="18" y="18" width="760" height="944" rx="18" fill="#f5f7f5" stroke="#d9e0dd"/>
    <rect x="822" y="18" width="760" height="944" rx="18" fill="#f5f7f5" stroke="#d9e0dd"/>

    <g>
      <text x="40" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#4e6a69" letter-spacing="3.2">ACTIVE TERMINAL</text>
      <text x="1038" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#4e6a69" letter-spacing="3.2">THREAT SIGNALS</text>

      <text x="40" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="55" fill="#1f2f2e" font-weight="600">Execution trace</text>
      <text x="1020" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="55" fill="#1f2f2e" font-weight="600">Recent detections</text>
      <text x="1460" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#4e6a69">0 total</text>

      <g transform="translate(824,58)">
        <circle cx="20" cy="26" r="8" fill="#56c1ad"/>
        <text x="42" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1a2d2f">GROQ CLOUD • SIMULATED STREAM</text>
      </g>
    </g>

    <g>
      <rect x="40" y="170" width="740" height="770" fill="#f6f9f8" stroke="#dfe7e1"/>
      <rect x="840" y="170" width="720" height="770" fill="#f6f9f8" stroke="#dfe7e1"/>
    </g>

    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="22" fill="#1b2e2a">
      <text x="70" y="230">[14:54:47]</text>
      <text x="230" y="230">→</text>
      <text x="260" y="230" fill="#1e3d3f">Fix validated.</text>

      <text x="70" y="290">[14:54:48]</text>
      <text x="230" y="290">→</text>
      <text x="260" y="290" fill="#1e3d3f">Generating adversarial scenario 2...</text>

      <text x="70" y="350">[14:54:50]</text>
      <text x="230" y="350">→</text>
      <text x="260" y="350" fill="#1e3d3f">Regression checks passed. Continuing pipeline...</text>

      <text x="70" y="410">[14:54:51]</text>
      <text x="230" y="410">→</text>
      <text x="260" y="410" fill="#1e3d3f">Initializing agent workspace...</text>

      <text x="70" y="470">[14:54:52]</text>
      <text x="230" y="470">→</text>
      <text x="260" y="470" fill="#1e3d3f">Generating adversarial scenario 1...</text>

      <text x="70" y="530">[14:54:54]</text>
      <text x="230" y="530">→</text>
      <text x="260" y="530" fill="#d76d42">Scenario failed. Triggering self-healing...</text>

      <text x="70" y="590">[14:54:55]</text>
      <text x="230" y="590">→</text>
      <text x="260" y="590" fill="#1e3d3f">Fixer proposed an instruction patch.</text>
    </g>

    <g>
      <rect x="770" y="200" width="10" height="680" rx="5" fill="#d6dedb"/>
      <rect x="770" y="310" width="10" height="280" rx="5" fill="#aab8b3"/>
      <rect x="770" y="770" width="10" height="68" rx="5" fill="#aab8b3" opacity="0.4"/>
    </g>

    <g>
      <circle cx="1040" cy="360" r="84" fill="#dfece7" stroke="#a8c9bf" stroke-width="2"/>
      <path d="M1010 360 L1030 380 L1083 328" fill="none" stroke="#4ec0a7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1010" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="33" fill="#1f2f2e" font-weight="600">No detections in this run</text>
      <text x="990" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#4d6d68">Failures will appear here as the pipeline reports them.</text>
    </g>

    <g>
      <rect x="860" y="640" width="640" height="210" rx="12" fill="#e7ece9" stroke="#d0dbd7"/>
      <text x="890" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#4b6662">Fixes resolved</text>
      <text x="1480" y="690" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#4b6662">0 / 0</text>
      <line x1="860" y1="715" x2="1500" y2="715" stroke="#d0dbd7"/>
      <text x="980" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#5d7873">Based on detected failures in the current run</text>
    </g>

    <g>
      <rect x="40" y="902" width="80" height="18" rx="8" fill="#56c1ad"/>
      <path d="M58 911 L71 924 L91 896" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
