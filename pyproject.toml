[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemesis"
version = "0.1.0"
description = "Experimental discovery engine for AI agent failures"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "litellm[mcp]>=1.40",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "groq>=0.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nemesis = "nemesis.cli:main"

[tool.setuptools.packages.find]
include = ["nemesis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
